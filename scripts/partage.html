<!doctype html>
<!--
  Image d'aperçu du lien Partisans (site/partage.png), 1200 × 630.
  Pour la régénérer : ouvrir ce fichier dans un navigateur dont la fenêtre fait 1200 × 630
  (Playwright : browser_resize puis browser_take_screenshot), puis retirer les métadonnées :
    convert capture.png -depth 8 -strip -define png:exclude-chunks=date,time site/partage.png
  Polices du site (../site/polices/) : servir le dépôt depuis sa racine avec
  python3 -m http.server 8001 --bind 127.0.0.1, puis ouvrir http://localhost:8001/scripts/partage.html
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Partisans : image de partage</title>
  <style>
    @font-face {
      font-family: 'Bricolage Grotesque';
      src: url(../site/polices/bricolage-grotesque.woff2) format('woff2');
      font-weight: 400 700;
    }
    html, body { margin: 0; }
    body {
      position: relative;
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      padding: 64px 72px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #C2341F;
      color: #EFEBE3;
      font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    }
    /* Grand poing ton sur ton : le disque déborde à droite et en bas, le poing reste entier. */
    .poing {
      position: absolute;
      right: -140px;
      bottom: -160px;
      width: 760px;
      height: 760px;
      background: #AD2D1A;
      -webkit-mask: url(../site/img/symbole.svg) center / contain no-repeat;
      mask: url(../site/img/symbole.svg) center / contain no-repeat;
    }
    .logo { position: relative; display: flex; align-items: center; gap: 14px; }
    .symbole {
      width: 56px;
      height: 56px;
      background: #EFEBE3;
      -webkit-mask: url(../site/img/symbole.svg) center / contain no-repeat;
      mask: url(../site/img/symbole.svg) center / contain no-repeat;
    }
    .logotype { font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: -0.04em; }
    .bas { position: relative; margin-top: auto; }
    .surtitre { margin: 0 0 22px; font-weight: 400; font-size: 22px; letter-spacing: 0.08em; text-transform: uppercase; }
    h1 { margin: 0; max-width: 640px; font-weight: 700; font-size: 132px; line-height: 0.88; letter-spacing: -0.05em; }
  </style>
</head>
<body>
  <span class="poing"></span>
  <div class="logo"><span class="symbole"></span><span class="logotype">partisans</span></div>
  <div class="bas">
    <p class="surtitre">Contre l'extrême droite, sur les réseaux</p>
    <h1>Rejoins les partisans.</h1>
  </div>
</body>
</html>
