<!doctype html>
<!--
  Image d'aperçu du lien Partisans (site/partage.png), 1200 × 630.
  Pour la régénérer : ouvrir ce fichier dans un navigateur dont la fenêtre fait 1200 × 630
  (Playwright : browser_resize puis browser_take_screenshot), puis retirer les métadonnées :
    convert capture.png -depth 8 -strip -define png:exclude-chunks=date,time site/partage.png
  Polices : Lato Black si elle est installée, sinon celle du système.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Partisans : image de partage</title>
  <style>
    html, body { margin: 0; }
    body {
      width: 1200px;
      height: 630px;
      box-sizing: border-box;
      padding: 72px 88px;
      display: flex;
      flex-direction: column;
      background: #d4202f;
      color: #fff;
      font-family: Lato, system-ui, sans-serif;
    }
    .marque { margin: 0; color: #f2b705; font-weight: 900; font-size: 34px; letter-spacing: 0.08em; }
    h1 { margin: 36px 0 0; max-width: 940px; font-weight: 900; font-size: 84px; line-height: 0.98; letter-spacing: -0.02em; }
    .appel { margin: auto 0 0; display: inline-block; align-self: flex-start; padding: 18px 28px; border-radius: 16px; background: #f2b705; color: #1d1416; font-weight: 900; font-size: 34px; }
  </style>
</head>
<body>
  <p class="marque">PARTISANS</p>
  <h1>Donne de la force à ceux qui combattent l'extrême droite</h1>
  <p class="appel">Abonne-toi à leurs comptes en quelques minutes.</p>
</body>
</html>
